<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Document Body Gradient -->
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Document Border Gradient -->
    <linearGradient id="docBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#45475a"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="starAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Facet Gradients -->
    <linearGradient id="sNorthLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sNorthRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="sSouthLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sSouthRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sEastTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="sEastBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sWestTop" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sWestBottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Document Outline with Corner Cut (x: 88, y: 36, w: 336, h: 440) -->
  <!-- Top Right cut starts at (328, 36) to (424, 132) -->
  <g filter="url(#docShadow)">
    <path d="M 120 36 
             L 328 36 
             L 424 132 
             L 424 444 
             A 32 32 0 0 1 392 476 
             L 120 476 
             A 32 32 0 0 1 88 444 
             L 88 68 
             A 32 32 0 0 1 120 36 Z" 
          fill="url(#docBg)" 
          stroke="url(#docBorder)" 
          stroke-width="4"/>
  </g>

  <!-- Folded Dog-Ear Corner -->
  <g filter="url(#foldShadow)">
    <path d="M 328 36 
             L 328 104 
             A 28 28 0 0 0 356 132 
             L 424 132 Z" 
          fill="url(#foldGrad)" 
          stroke="#585b70" 
          stroke-width="2"/>
    <!-- Fold highlight edge -->
    <line x1="328" y1="36" x2="424" y2="132" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Subtle Blueprint / Grid Lines in Document Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="120" y1="180" x2="392" y2="180"/>
    <line x1="120" y1="210" x2="392" y2="210"/>
    <line x1="120" y1="240" x2="392" y2="240"/>
    <line x1="120" y1="270" x2="392" y2="270"/>
    <line x1="120" y1="300" x2="392" y2="300"/>
    <line x1="120" y1="330" x2="392" y2="330"/>
  </g>

  <!-- Central Radiant Star Glyph (Centered at cx: 256, cy: 240) -->
  <g filter="url(#starAura)">
    <!-- Aura halo -->
    <circle cx="256" cy="240" r="70" fill="#6366f1" opacity="0.25"/>
    <circle cx="256" cy="240" r="45" fill="#38bdf8" opacity="0.3"/>

    <!-- Diagonal Sparks -->
    <polygon points="256,240 294,222 320,200 272,228" fill="#fbbf24" opacity="0.85"/>
    <polygon points="256,240 244,200 216,172 238,222" fill="#38bdf8" opacity="0.85"/>
    <polygon points="256,240 272,252 300,280 266,258" fill="#fbbf24" opacity="0.85"/>
    <polygon points="256,240 218,258 190,286 238,252" fill="#818cf8" opacity="0.85"/>

    <!-- Primary 4-Point Star Facets -->
    <!-- North -->
    <polygon points="256,120 256,240 220,240" fill="url(#sNorthLeft)"/>
    <polygon points="256,120 292,240 256,240" fill="url(#sNorthRight)"/>

    <!-- South -->
    <polygon points="256,360 220,240 256,240" fill="url(#sSouthLeft)"/>
    <polygon points="256,360 256,240 292,240" fill="url(#sSouthRight)"/>

    <!-- East -->
    <polygon points="376,240 256,204 256,240" fill="url(#sEastTop)"/>
    <polygon points="376,240 256,240 256,276" fill="url(#sEastBottom)"/>

    <!-- West -->
    <polygon points="136,240 256,204 256,240" fill="url(#sWestTop)"/>
    <polygon points="136,240 256,240 256,276" fill="url(#sWestBottom)"/>

    <!-- Core Diamond Center -->
    <polygon points="256,200 278,240 256,280 234,240" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="240" r="10" fill="#fef08a"/>
  </g>

  <!-- Bottom File Extension Pill Badge: .STAR -->
  <g>
    <!-- Badge Background Pill -->
    <rect x="136" y="388" width="240" height="60" rx="16" ry="16" fill="url(#badgeBg)" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Accent Sparkle Dot -->
    <circle cx="172" cy="418" r="6" fill="#fbbf24"/>

    <!-- .star Text -->
    <text x="264" y="429" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#ffffff">.star</text>
  </g>
</svg>

