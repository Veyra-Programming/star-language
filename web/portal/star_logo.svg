<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#141936"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Facet Gradients: North -->
    <linearGradient id="facetNorthLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="facetNorthRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Facet Gradients: South -->
    <linearGradient id="facetSouthLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="facetSouthRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Facet Gradients: East -->
    <linearGradient id="facetEastTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="facetEastBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Facet Gradients: West -->
    <linearGradient id="facetWestTop" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="facetWestBottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Core Center Radial -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal Minor Facet Gradient -->
    <linearGradient id="diagFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#subtleShadow)"/>

  <!-- Subtle Orbital Continuity Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Radiant Aura -->
  <circle cx="256" cy="256" r="120" fill="url(#coreGlow)" opacity="0.45"/>

  <!-- Star Structure Filter Group -->
  <g filter="url(#starGlow)">
    
    <!-- Minor Diagonal Points (NE, NW, SE, SW) -->
    <!-- NE Point -->
    <polygon points="256,256 312,232 352,200 280,240" fill="url(#diagFacet)" opacity="0.85"/>
    <!-- NW Point -->
    <polygon points="256,256 240,200 200,160 232,232" fill="url(#facetNorthLeft)" opacity="0.75"/>
    <!-- SE Point -->
    <polygon points="256,256 280,272 320,312 272,280" fill="url(#facetEastBottom)" opacity="0.75"/>
    <!-- SW Point -->
    <polygon points="256,256 200,280 160,320 232,272" fill="url(#facetSouthRight)" opacity="0.75"/>

    <!-- Major Facets: 4-Point Primary Star -->
    
    <!-- NORTH POINT -->
    <!-- North Left Facet -->
    <polygon points="256,76 256,256 206,256" fill="url(#facetNorthLeft)"/>
    <!-- North Right Facet -->
    <polygon points="256,76 306,256 256,256" fill="url(#facetNorthRight)"/>

    <!-- SOUTH POINT -->
    <!-- South Left Facet -->
    <polygon points="256,436 206,256 256,256" fill="url(#facetSouthLeft)"/>
    <!-- South Right Facet -->
    <polygon points="256,436 256,256 306,256" fill="url(#facetSouthRight)"/>

    <!-- EAST POINT -->
    <!-- East Top Facet -->
    <polygon points="436,256 256,206 256,256" fill="url(#facetEastTop)"/>
    <!-- East Bottom Facet -->
    <polygon points="436,256 256,256 256,306" fill="url(#facetEastBottom)"/>

    <!-- WEST POINT -->
    <!-- West Top Facet -->
    <polygon points="76,256 256,206 256,256" fill="url(#facetWestTop)"/>
    <!-- West Bottom Facet -->
    <polygon points="76,256 256,256 256,306" fill="url(#facetWestBottom)"/>

    <!-- Inner Core Diamond Highlight -->
    <polygon points="256,196 288,256 256,316 224,256" fill="#ffffff" opacity="0.95"/>
    <polygon points="256,220 274,256 256,292 238,256" fill="#fef08a"/>

    <!-- Brilliant Center Nexus -->
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>
</svg>
